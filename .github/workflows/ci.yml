# Build, check and publish the NixOS flake using nixpkgs' stock glibc packages.
#
# nixpkgs nixos-unstable, pinned by flake.lock, provides every package. The runner uses
# cache.nixos.org for stock packages and may also use this project's GHCR cache
# for paths used by CI (docs/nixos.md, "Binary cache").
#
# Every job runs on a hosted Ubuntu runner and calls `nix` or `oras` directly,
# the same commands a person would run, so a failure here reproduces at a desk.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  # A run started by hand publishes like a main run. Given a tag, it makes a
  # release under that tag and title instead of a nightly (`publish`).
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag for a release of this commit, such as v0.1.0. Empty publishes a nightly."
        type: string
        default: ""
      title:
        description: "The release's title, such as LosOS 0.1. Empty uses the tag."
        type: string
        default: ""

# Read-only by default, because a pull request's run executes branch code. The
# jobs that write ask for it themselves.
#
# Every action is pinned to a commit, with its tag beside it. A tag can be
# moved by whoever controls the action's repository, and the jobs that run
# these hold packages: write, contents: write and the cache signing key, so a
# moved tag would be code running beside all three.
permissions:
  contents: read

# A newer push to a pull request cancels the run already going. Runs that
# publish queue instead, so none is killed half-way through an upload.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The channel the images are built for, `losos.channel` (flake.nix reads it):
# what an installed system updates from (docs/releases.md).
# Every run builds and publishes the nightly, but for a run started by hand
# with a tag, which is a release of the stable channel. The images then
# follow the stable channel, and `publish` moves its tags rather than the
# nightly's.
env:
  LOSOS_CHANNEL: ${{ github.event_name == 'workflow_dispatch' && inputs.tag != '' && 'stable' || 'nightly' }}

jobs:
  # Every package the release needs, built on each architecture before the
  # image is assembled: the patched GTK and Qt, everything that links them,
  # and this repository's own programs. Nothing lists them:
  # tools/nix-prebuild-plan finds them by evaluating the release twice with
  # different versions and keeping what did not change, so a package a
  # later overlay or module adds is prebuilt without editing this file.
  # Whatever a substituter has is skipped. Outside a pull request whatever it builds goes
  # to the project cache, so later runs, and any build host that reads the
  # proxy, substitute it instead of compiling it again. In every run it also
  # hands what it compiled to `flake` as an artifact, because a pull request
  # writes nothing to the cache and the proxy may not be configured yet.
  #
  # It has the same time budget as `flake` and the same rules: what finished
  # is kept, running out of time passes with a warning, a failed derivation
  # turns it red. A retry of either job starts from what the cache holds.
  prebuild:
    strategy: &arches
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, arch: x86_64 }
          - { runner: ubuntu-24.04-arm, arch: aarch64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 355
    # As in `flake`: packages: write reaches only the cache push step.
    permissions:
      contents: read
      packages: write
    env: &nix-env
      # With LOSOS_PROXY_URL set, the images update from that proxy and ping
      # it; without it they update from GitHub Releases through the
      # documentation site's index (nixos/modules/update-source.nix). The
      # project's Nix cache is read through proxy/serve.ts on the runner
      # itself (the step after the checkout), not through the public
      # deployment, so a build substitutes what earlier runs pushed even
      # while that deployment is down. The optional key configures it
      # alongside cache.nixos.org.
      LOSOS_PROXY_URL: ${{ vars.LOSOS_PROXY_URL }}
      NIX_CACHE_URL: http://127.0.0.1:8484
      NIX_CACHE_PUBLIC_KEY: ${{ vars.NIX_CACHE_PUBLIC_KEY }}
      NIX_VERSION: "2.34.8"
      # The installer script's own hash, from releases.nixos.org's
      # install.sha256 for that version. The script carries the tarball's
      # hash, so checking it pins every byte the install runs as root.
      NIX_INSTALLER_SHA256: "96c10e102c88809dd9ec0bee89200c4a51eae4c9f6d8698c26b16788d131e078"
    steps:
      - &free-disk
        name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache /usr/share/swift \
            /usr/local/share/boost /usr/local/share/powershell
          df -h /

      # The official installer is pinned, rather than using a third party's
      # action. Builds substitute stock packages from nixpkgs' binary cache.
      #
      # The boot test asks for the kvm feature, and only the x86_64 runner has
      # /dev/kvm.
      - &install-nix
        name: Install Nix
        run: |
          curl -sSfL --proto '=https' \
            "https://releases.nixos.org/nix/nix-$NIX_VERSION/install" -o install-nix
          echo "$NIX_INSTALLER_SHA256  install-nix" | sha256sum -c -
          sh install-nix --daemon --yes --no-channel-add
          # Ubuntu 24.04's AppArmor stops unprivileged processes making user
          # namespaces, and a Nix build user is one. Test suites that run
          # bwrap inside the build, such as xdg-desktop-portal's icon and
          # sound validators, then fail on this runner and nowhere else.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          features="nixos-test benchmark big-parallel"
          if [ -e /dev/kvm ]; then
            sudo chmod 0666 /dev/kvm
            features="$features kvm"
          fi
          # The compiler cache the overlay's patched packages use when it is
          # there (nixos/pkgs/default.nix, withCcache). The build users are
          # not root, so it is writable by all; only `prebuild` fills it.
          sudo mkdir -p /var/lib/losos-ccache
          sudo chmod 0777 /var/lib/losos-ccache
          {
            echo "experimental-features = nix-command flakes"
            echo "system-features = $features"
            echo "max-jobs = auto"
            echo "extra-sandbox-paths = /var/cache/losos-ccache=/var/lib/losos-ccache"
            if [ -n "$NIX_CACHE_URL" ] && [ -n "$NIX_CACHE_PUBLIC_KEY" ]; then
              echo "substituters = https://cache.nixos.org/ $NIX_CACHE_URL"
              echo "trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= $NIX_CACHE_PUBLIC_KEY"
            else
              echo "substituters = https://cache.nixos.org/"
            fi
          } | sudo tee -a /etc/nix/nix.conf
          sudo systemctl restart nix-daemon
          echo "/nix/var/nix/profiles/default/bin" >> "$GITHUB_PATH"

      # submodules: derisk, mcsapi and pm are components/ submodules the flake
      # builds from (flake.nix, `self.submodules`). All three are public, so
      # the checkout needs no token for them.
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false, submodules: true }

      # The proxy's handler, run by node on this runner at NIX_CACHE_URL,
      # before anything asks Nix to substitute. The GHCR packages are public,
      # so it holds no token. It runs in the background for the rest of the
      # job; a step that dies before it is up leaves Nix with a substituter
      # that refuses connections, which Nix warns about and skips.
      - &serve-cache
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22 }
      - &serve-cache-start
        name: Serve the project's Nix cache on the runner
        env:
          GHCR_REPOSITORY: ${{ github.repository }}
        run: |
          sh proxy/build.sh
          nohup node --experimental-strip-types proxy/serve.ts "${NIX_CACHE_URL#http://}" \
            > "$RUNNER_TEMP/serve.log" 2>&1 &
          for _ in $(seq 30); do
            if curl -sSf "$NIX_CACHE_URL/nix-cache-info"; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/serve.log"
          echo "::warning::The local cache did not start, so this build compiles what cache.nixos.org lacks."

      # Fixed-output inputs come from cache.nixos.org where it has them, with
      # copied outputs checked against their hashes. This includes pinned
      # bootstrap and compiler inputs as well as upstream source archives.
      - name: Fetch fixed-output inputs
        run: tools/nix-fetch-sources .#release

      # Record the store after preloading so the cache push excludes both the
      # Nix installer and every path added by the fetch, even if it failed.
      - &note-prebuilt
        name: Note what came prebuilt
        if: always()
        run: nix path-info --all > "$RUNNER_TEMP/prebuilt.txt"

      - name: Find the packages
        run: tools/nix-prebuild-plan ${{ matrix.arch }} > "$RUNNER_TEMP/plan.txt"

      # The compiler cache the last run on main left in GHCR, through the
      # proxy where it serves it. It only helps when something has to compile again:
      # a nixpkgs bump that moves GTK or Qt by a point release, or a changed
      # patch, recompiles only the files that differ. A pull request reads
      # it and writes nothing back.
      - uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4 # v2.0.2
      - name: Restore the compiler cache
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CCACHE_REF: ghcr.io/${{ github.repository }}/losos-ccache:${{ matrix.arch }}
        run: |
          trap 'oras logout ghcr.io || true' EXIT
          printf '%s' "$GHCR_TOKEN" \
            | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          tools/build-cache-fetch losos ${{ matrix.arch }} /var/lib/losos-ccache "$CCACHE_REF"
          touch "$RUNNER_TEMP/ccache-restored"

      # One derivation at a time: the runners have 16 GB, and WPE WebKit
      # compiling on every core beside derisk's or pm's LTO link filled it,
      # after which the machine swapped until it stopped answering and the
      # service took the runner away ("received a shutdown signal", exit
      # 143, on main and every pull request since #145). Each of those fits
      # on its own, and each gets every core for itself anyway.
      - name: Build the packages
        id: build
        run: |
          set +e
          timeout --signal=INT 300m nix build --impure -L --keep-going --no-link --max-jobs 1 --stdin < "$RUNNER_TEMP/plan.txt" \
            2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" = 0 ]; then
            echo "complete=true" >> "$GITHUB_OUTPUT"
          elif [ "$status" = 124 ] && ! grep -q "^error: builder for .* failed" build.log; then
            echo "::warning::The build ran out of time with nothing failed. What finished goes to the cache, and the next run continues from there."
            echo "complete=false" >> "$GITHUB_OUTPUT"
          else
            grep -A20 "^error: builder for .* failed" build.log | head -80 || true
            exit 1
          fi

      # Saved after a run that ran out of time too, so the next run starts
      # from every object this one compiled. Split because GHCR refuses a
      # layer over 10 GB.
      - name: Save the compiler cache
        if: always() && github.event_name != 'pull_request' && steps.build.outputs.complete != ''
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CCACHE_REF: ghcr.io/${{ github.repository }}/losos-ccache:${{ matrix.arch }}
        run: |
          trap 'oras logout ghcr.io || true' EXIT
          printf '%s' "$GHCR_TOKEN" \
            | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          # Everything may have substituted, leaving the cache as restored.
          newer=()
          [ -e "$RUNNER_TEMP/ccache-restored" ] && newer=(-newer "$RUNNER_TEMP/ccache-restored")
          if [ -z "$(sudo find /var/lib/losos-ccache -type f "${newer[@]}" -print -quit)" ]; then
            echo "Nothing compiled through the cache; keeping the one in GHCR."
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/ccache-save"
          cd "$RUNNER_TEMP/ccache-save"
          sudo tar --zstd -c -C /var/lib/losos-ccache . \
            | split -b 4G -d -a 2 - ccache.tar.zst.part-
          oras push "${CCACHE_REF,,}" \
            --artifact-type application/vnd.losos.ccache.v1 \
            --annotation "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            ccache.tar.zst.part-*

      # Every path the build added goes to the cache, not only the release's
      # closure. After a run that ran out of time the closure is not complete,
      # but what was built is on disk, and the next run would otherwise
      # build it again. A pull request reads the cache and writes nothing.
      # Uploading is independent of NIX_CACHE_URL: the GHCR paths can be served
      # by the proxy later, even when CI is not configured to fetch through it.
      - &setup-oras
        uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4 # v2.0.2
        if: always() && github.event_name != 'pull_request'
      - &cache-push
        name: Push what was built to the cache
        if: always() && github.event_name != 'pull_request'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NIX_CACHE_SIGNING_KEY: ${{ secrets.NIX_CACHE_SIGNING_KEY }}
        run: |
          if [ -z "$NIX_CACHE_SIGNING_KEY" ]; then
            echo "::warning::NIX_CACHE_SIGNING_KEY is not set, so nothing goes to the cache."
            exit 0
          fi
          trap 'rm -f "$RUNNER_TEMP/cache.sec"; oras logout ghcr.io || true' EXIT
          printf '%s' "$GHCR_TOKEN" \
            | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          umask 077
          printf '%s' "$NIX_CACHE_SIGNING_KEY" > "$RUNNER_TEMP/cache.sec"
          tools/nix-cache-push --all \
            --exclude-from "$RUNNER_TEMP/prebuilt.txt" \
            --repository "ghcr.io/${GITHUB_REPOSITORY,,}/nix-cache" \
            --secret-key-file "$RUNNER_TEMP/cache.sec"

      # What this job compiled, for `flake` to import before it builds: a
      # `nix-store --export` stream of every path it built itself, which
      # `ultimate` marks, rather than one it substituted, which `flake` can
      # substitute as well. Import refuses a path before its references, so
      # the list is in closure order, and the references it does not carry
      # are listed for `flake` to substitute first. The plan goes too, and
      # `complete` says all of it was built, which is what lets `flake`
      # check that none of it is left to compile.
      - name: Hand what was built to the release build
        if: always()
        env:
          COMPLETE: ${{ steps.build.outputs.complete }}
        run: |
          out="$RUNNER_TEMP/prebuilt" work="$RUNNER_TEMP/handover"
          mkdir -p "$out" "$work"
          nix path-info --json --json-format 1 --all \
            | jq -r 'to_entries[] | select(.value.ultimate) | .key' \
            | grep -v '\.drv$' \
            | awk 'NR == FNR { skip[$0] = 1; next } !($0 in skip)' "$RUNNER_TEMP/prebuilt.txt" - \
            > "$work/built" || true
          xargs -r nix-store --query --requisites < "$work/built" > "$work/closure"
          awk 'NR == FNR { built[$0] = 1; next } ($0 in built) && !seen[$0]++' \
            "$work/built" "$work/closure" > "$out/paths.txt"
          xargs -r nix-store --query --references < "$out/paths.txt" | sort -u > "$work/references"
          awk 'NR == FNR { built[$0] = 1; next } !($0 in built)' \
            "$out/paths.txt" "$work/references" > "$out/references.txt"
          if [ -s "$out/paths.txt" ]; then
            # One stream: import stops at the first end marker, so two
            # exports concatenated would lose the second.
            # shellcheck disable=SC2046 # one store path per line, no spaces
            nix-store --export $(cat "$out/paths.txt") | zstd -T0 -3 > "$out/paths.nar.zst"
          fi
          cp "$RUNNER_TEMP/plan.txt" "$out/plan.txt" || true
          if [ "$COMPLETE" = true ]; then touch "$out/complete"; fi
          echo "Built $(wc -l < "$out/paths.txt") path(s); $(du -sh "$out" | cut -f1) to hand over."
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: prebuilt-${{ matrix.arch }}
          path: ${{ runner.temp }}/prebuilt/
          if-no-files-found: error
          retention-days: 1

  # The flake, built and checked on both architectures. From an empty cache
  # the whole OS is thousands of derivations, far more than one runner's six
  # hours, so the build has a time budget. Whatever finished goes to the cache
  # whether or not the rest did, and the next run starts from there. A run
  # that ran out of time with nothing failed passes with a warning; a failed
  # derivation turns it red. Once a build completes, the job checks the flake,
  # boots the VM tests, and hands the release to `push` as an artifact. A VM
  # test that fails to boot only warns: the image is already built, and a
  # flaky boot under the runner's KVM is no reason to hold the nightly back.
  # It starts after
  # `prebuild`, from what that compiled, so it is left with assembling the
  # image. A failed `prebuild` does not stop it: the same derivation fails
  # here too, and everything else it builds is kept.
  flake:
    needs: [prebuild]
    if: always() && needs.prebuild.result != 'cancelled'
    strategy: *arches
    runs-on: ${{ matrix.runner }}
    timeout-minutes: &flake-minutes 355
    # packages: write is for the cache push, which has to run here because the
    # store it reads is on this runner. The token reaches only that step, and
    # oras logs out at the end of it. Everything the build compiles runs inside
    # the Nix sandbox as a build user, which sees neither the step environment
    # nor the runner's home directory. The release itself is pushed by `push`,
    # which runs no build code at all.
    permissions:
      contents: read
      packages: write
    env: *nix-env
    steps:
      # The VM tests get whatever is left of the job's time, and GitHub does
      # not say when a job started, so the job notes it itself.
      - name: Note the start time
        run: date +%s > "$RUNNER_TEMP/job-started"
      - *free-disk
      - *install-nix
      - *checkout
      - *serve-cache
      - *serve-cache-start

      # Fixed-output inputs come from cache.nixos.org where it has them, with
      # copied outputs checked against their hashes. This includes pinned
      # bootstrap and compiler inputs as well as upstream source archives.
      # It runs before the import because it evaluates `.#release`, and
      # evaluation is what adds the flake's own sources (a crate's Cargo.lock,
      # an eval-time fetch) to the store. prebuild's references include them,
      # and no substituter has them, so realising them before this evaluation
      # failed with "there is no substituter that can build it".
      - name: Fetch fixed-output inputs
        run: tools/nix-fetch-sources .#release

      # What `prebuild` compiled for this architecture. The paths it refers
      # to and did not build are stock ones, and come from the substituters
      # first, because an import refuses a path whose references are not in
      # the store. Importing needs a trusted user, which root is.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: prebuilt-${{ matrix.arch }}
          path: prebuilt
      - name: Import what prebuild compiled
        run: |
          if [ ! -f prebuilt/paths.txt ]; then
            echo "::warning::prebuild handed nothing over, so this build compiles whatever the cache lacks."
            exit 0
          fi
          # Evaluation copies some inputs into the store itself (a `./file`
          # literal, a `cargoLock.lockFile`, nixpkgs' programs.sqlite). What
          # prebuild compiled refers to them, no substituter has them, and
          # the handover leaves them out, so they come from evaluating this
          # checkout before the references are realised.
          nix path-info --impure --derivation .#release > /dev/null
          xargs -r nix-store --realise < prebuilt/references.txt > /dev/null
          if [ -s prebuilt/paths.txt ]; then
            zstd -dc prebuilt/paths.nar.zst | sudo "$(command -v nix-store)" --import > /dev/null
          fi
          echo "Imported $(wc -l < prebuilt/paths.txt) path(s)."

      # The check that the split saves anything. Once `prebuild` built all of
      # its plan, every package in it is either in this store or in a
      # substituter, so a plan that still compiles one means this job
      # evaluated different derivations, or the handover lost them. That is
      # a bug, and is reported here instead of costing hours below.
      - name: Check nothing prebuilt is left to compile
        run: |
          if [ ! -f prebuilt/complete ]; then
            echo "::warning::prebuild did not finish, so this build compiles what it left."
            exit 0
          fi
          nix build --dry-run --stdin < prebuilt/plan.txt 2> dry-run.txt
          if grep -q 'will be built' dry-run.txt; then
            sed -n '/will be built/,/will be fetched/p' dry-run.txt | head -60
            echo "::error::prebuild built its whole plan, but this job would compile the derivations above again."
            exit 1
          fi
          echo "Every prebuilt package is in the store or a substituter."

      # Record the store after preloading and importing, so the cache push
      # excludes the Nix installer, every path the fetch added, and what
      # `prebuild` already pushed.
      - *note-prebuilt

      - name: Build the release
        id: build
        run: |
          set +e
          timeout --signal=INT 300m nix build --impure -L --keep-going --out-link release .#release \
            2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" = 0 ]; then
            echo "complete=true" >> "$GITHUB_OUTPUT"
          elif [ "$status" = 124 ] && ! grep -q "^error: builder for .* failed" build.log; then
            echo "::warning::The build ran out of time with nothing failed. What finished goes to the cache, and the next run continues from there."
            echo "complete=false" >> "$GITHUB_OUTPUT"
          else
            grep -A20 "^error: builder for .* failed" build.log | head -80 || true
            exit 1
          fi

      # As in `prebuild`.
      - *setup-oras
      - *cache-push

      # Formatting is checked by `format`, not here: run after the build, a
      # misplaced space failed a run only once hours of building had finished.
      #
      # `nix flake check` would build the VM tests with everything else, and
      # their failure would fail the job. So it only evaluates here, and the
      # checks are built in two halves. A check with a `driver` is a NixOS VM
      # test (runNixOSTest); every other check, and each VM test's driver with
      # the disks and images it boots, is a build, and fails the job like one.
      - name: Check the flake
        id: check
        if: steps.build.outputs.complete == 'true'
        run: |
          nix flake check --impure --no-build -L
          system=$(nix eval --impure --raw --expr builtins.currentSystem)
          nix eval --impure --json ".#checks.$system" \
            --apply 'cs: builtins.mapAttrs (_: c: if c ? driver then c.outPath else "") cs' \
            > checks.json
          jq -r 'to_entries[] | select(.value == "") | .key' checks.json > builds.txt
          jq -r 'to_entries[] | select(.value != "") | .key' checks.json > vm-tests.txt
          {
            sed "s|^|.#checks.$system.|" builds.txt
            sed "s|^|.#checks.$system.|; s|$|.driver|" vm-tests.txt
          } | xargs nix build --impure -L --keep-going --no-link
          echo "system=$system" >> "$GITHUB_OUTPUT"

      # The VM tests boot the image under QEMU (KVM on x86_64; aarch64 has
      # none). A test that fails, or does not finish in the time the job has
      # left, is a warning and a line in the job summary, not a red job: the
      # image passed every other check, and `push` and `publish` still get it.
      # The step ends with 20 minutes to spare for the release upload below,
      # because the job running out of time would fail it after all, and a
      # mistake in the script itself only marks the step.
      - name: Boot the VM tests
        if: steps.check.outputs.system != ''
        continue-on-error: true
        env:
          SYSTEM: ${{ steps.check.outputs.system }}
          JOB_MINUTES: *flake-minutes
        run: |
          if [ ! -s vm-tests.txt ]; then
            echo "$SYSTEM has no VM tests."
            exit 0
          fi
          left=$(( JOB_MINUTES * 60 - ($(date +%s) - $(cat "$RUNNER_TEMP/job-started")) - 20 * 60 ))
          mapfile -t tests < <(sed "s|^|.#checks.$SYSTEM.|" vm-tests.txt)
          status=124
          if [ "$left" -gt 0 ]; then
            set +e
            timeout --signal=INT --kill-after=2m "$left" nix build --impure -L --keep-going --no-link "${tests[@]}"
            status=$?
            set -e
          fi
          failed=0
          {
            echo "### VM tests ($SYSTEM)"
            echo
            echo "| Test | Result |"
            echo "| --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"
          while read -r name; do
            # A test passed when its output is a valid store path. Nix leaves
            # a failed build's output on disk, unregistered, so the path
            # merely existing proved nothing: every failure read as passed.
            if nix path-info "$(jq -r --arg n "$name" '.[$n]' checks.json)" > /dev/null 2>&1; then
              result=passed
            elif [ "$status" = 124 ]; then
              result="did not finish in the time the job had left"
              failed=$((failed + 1))
            else
              result=failed
              failed=$((failed + 1))
            fi
            echo "| \`checks.$SYSTEM.$name\` | $result |" >> "$GITHUB_STEP_SUMMARY"
            if [ "$result" != passed ]; then
              echo "::warning title=VM test $name::checks.$SYSTEM.$name $result. This does not fail the job; its log is above."
            fi
          done < vm-tests.txt
          echo "$failed of $(wc -l < vm-tests.txt) VM test(s) did not pass."

      # The release goes to `push` as an artifact, with its architecture and
      # version beside it. Only a completed build whose flake check passed
      # gets this far; the VM tests above do not decide it.
      - name: Collect the release
        id: collect
        if: github.event_name != 'pull_request' && steps.build.outputs.complete == 'true'
        run: |
          arch=$(uname -m)
          mkdir -p "$RUNNER_TEMP/release"
          cp -L release/* "$RUNNER_TEMP/release/"
          nix eval --impure --raw ".#nixosConfigurations.losos-desktop-$arch.config.losos.version" \
            > "$RUNNER_TEMP/release/.version"
          echo "arch=$arch" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.collect.outputs.arch != ''
        with:
          name: release-${{ steps.collect.outputs.arch }}
          path: ${{ runner.temp }}/release/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

  # Pushes each architecture's release to GHCR. This is the only job that
  # holds packages: write next to release files, and it checks out and builds
  # nothing, so no code from the branch runs beside the token.
  push:
    needs: [flake]
    if: always() && github.event_name != 'pull_request' && needs.flake.result != 'cancelled'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4 # v2.0.2
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { pattern: "release-*", path: built }

      # Each architecture's SHA256SUMS is signed here, beside nothing but the
      # downloaded release, so the key never shares a runner with build code.
      # sysupdate on an installed system fetches SHA256SUMS.gpg next to it and
      # refuses an update the key in nixos/keys/update-signing.asc did not
      # sign. A release is never pushed unsigned: an image that trusts the key
      # could not install it, and one that does not would install anything.
      - name: Push the releases to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          # The primary fingerprint of nixos/keys/update-signing.asc. This job
          # checks out no code, so it cannot read that file; change both
          # together.
          UPDATE_SIGNING_FPR: "7FD984194AB8DDFF17DA0B0CDCDCF53B64988CBD"
        run: |
          shopt -s nullglob
          dirs=(built/release-*)
          if [ ${#dirs[@]} = 0 ]; then
            echo "No architecture finished a build, so there is nothing to push."
            exit 0
          fi
          if [ -z "$UPDATE_SIGNING_KEY" ]; then
            echo "::error::UPDATE_SIGNING_KEY is not set, so the release cannot be signed. docs/nixos.md says how to make it."
            exit 1
          fi
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          trap 'rm -rf "$GNUPGHOME"; oras logout ghcr.io || true' EXIT
          mkdir -m 700 "$GNUPGHOME"
          printf '%s\n' "$UPDATE_SIGNING_KEY" | gpg --batch --import
          # Verifying below only proves the secret matches itself. An update
          # signed by any other key would be refused by every installed image.
          have=$(gpg --batch --with-colons --list-secret-keys | awk -F: '$1 == "fpr" { print $10; exit }')
          if [ "$have" != "$UPDATE_SIGNING_FPR" ]; then
            echo "::error::UPDATE_SIGNING_KEY is key ${have:-none}, but the images trust $UPDATE_SIGNING_FPR."
            exit 1
          fi
          printf '%s' "$GHCR_TOKEN" \
            | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          mkdir -p refs
          for dir in "${dirs[@]}"; do
            arch=${dir#built/release-}
            version=$(cat "$dir/.version")
            # Name the key: without --local-user gpg signs with whichever
            # secret key it prefers, which need not be the one checked above.
            gpg --batch --yes --local-user "$UPDATE_SIGNING_FPR" --detach-sign \
              --output "$dir/SHA256SUMS.gpg" "$dir/SHA256SUMS"
            signer=$(gpg --batch --status-fd 1 --verify "$dir/SHA256SUMS.gpg" "$dir/SHA256SUMS" \
              | awk '$2 == "VALIDSIG" { print $NF }')
            if [ "$signer" != "$UPDATE_SIGNING_FPR" ]; then
              echo "::error::$arch SHA256SUMS was signed by ${signer:-no valid key}, not $UPDATE_SIGNING_FPR."
              exit 1
            fi
            (
              cd "$dir"
              oras push "ghcr.io/${GITHUB_REPOSITORY,,}/images:$LOSOS_CHANNEL-$version-$arch" \
                --artifact-type application/vnd.losos.release.v1 \
                --annotation "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
                --annotation "org.opencontainers.image.version=$version" \
                --format json \
                -- * | jq -r .reference
            ) > "refs/release-ref-$arch.txt"
            echo "- $arch: \`$(cat "refs/release-ref-$arch.txt")\`" >> "$GITHUB_STEP_SUMMARY"
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-refs
          path: refs/
          if-no-files-found: ignore
          retention-days: 3

  # nixfmt over the tree, on its own so a formatting slip shows within minutes
  # of a push. It needs only the formatter from cache.nixos.org, builds
  # nothing, and neither waits for nor holds back the build or the release;
  # `ci` still requires it. `nix fmt` locally rewrites what this rejects.
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NIX_VERSION: "2.34.8"
      # The installer script's own hash, from releases.nixos.org's
      # install.sha256 for that version. The script carries the tarball's
      # hash, so checking it pins every byte the install runs as root.
      NIX_INSTALLER_SHA256: "96c10e102c88809dd9ec0bee89200c4a51eae4c9f6d8698c26b16788d131e078"
    steps:
      - name: Install Nix
        run: |
          curl -sSfL --proto '=https' \
            "https://releases.nixos.org/nix/nix-$NIX_VERSION/install" -o install-nix
          echo "$NIX_INSTALLER_SHA256  install-nix" | sha256sum -c -
          sh install-nix --daemon --yes --no-channel-add
          echo "experimental-features = nix-command flakes" | sudo tee -a /etc/nix/nix.conf
          sudo systemctl restart nix-daemon
          echo "/nix/var/nix/profiles/default/bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Check formatting
        run: |
          if ! nix fmt -- --ci; then
            git diff
            echo "::error::Run \`nix fmt\` and commit the result."
            exit 1
          fi

  # The GHCR proxy: its decisions in Rust, then the handler against a fake
  # registry. Nothing is deployed from here.
  proxy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: proxy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo test
      # The tests are TypeScript run by node itself, which strips the types
      # from 22.6 on; the runner's own node may be older.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22 }
      - run: npm ci
      - run: npm run typecheck
      # Builds the module the handler tests load, then runs them.
      - run: npm test

  # The one check branch protection looks for, so a skipped or cancelled job
  # never reads as green.
  ci:
    needs: [prebuild, flake, format, proxy, release-name]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every job
        env:
          PREBUILD: ${{ needs.prebuild.result }}
          FLAKE: ${{ needs.flake.result }}
          FORMAT: ${{ needs.format.result }}
          PROXY: ${{ needs.proxy.result }}
          RELEASE_NAME: ${{ needs.release-name.result }}
        run: |
          test "$PREBUILD" = success
          test "$FLAKE" = success
          test "$FORMAT" = success
          test "$PROXY" = success
          # Skipped unless a run started by hand names a tag.
          test "$RELEASE_NAME" != failure

  # A tag given to a run started by hand is checked before anything is
  # built, so a name that is malformed or already released fails in seconds
  # rather than after the build. `ci` requires it, and `publish` waits on it.
  release-name:
    if: github.event_name == 'workflow_dispatch' && inputs.tag != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check the tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          # A git ref name that is also a plain release asset URL segment.
          # nightly- names belong to the nightlies, which a hand-made tag
          # would otherwise take before its run did.
          if ! [[ "$TAG" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,99}$ ]] || [[ "$TAG" == *..* ]]; then
            echo "::error::'$TAG' is not a tag name: letters, digits, '.', '_' and '-', starting with a letter or digit."
            exit 1
          fi
          if [[ "$TAG" == nightly* ]]; then
            echo "::error::Tags starting with 'nightly' are the nightlies'. Pick another name."
            exit 1
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null | grep -qx false; then
            echo "::error::$TAG is already released, and a release is never edited."
            exit 1
          fi

  # Moves the channel's tag in GHCR and publishes the run as its own GitHub
  # release, tagged `nightly-<YYYYMMDD>T<HHMM>` from the commit's time (the
  # version every file name carries, flake.nix) and marked a prerelease.
  # sysupdate keeps reading the channel tag through proxy/; the release is the
  # same artifacts for a person to download, pinned to the commit. Only an
  # architecture that finished its build and passed its flake check reached
  # GHCR, so that is the gate. A failed VM test is not part of it (`flake`).
  #
  # Each release is created once and never edited afterwards, which is what
  # lets the repository make releases immutable. That is also why there is no
  # moving `nightly` release any more: GitHub refuses to reuse the tag of a
  # deleted immutable release, so one could not be replaced.
  #
  # A run started by hand with a tag publishes its files as a release under
  # that tag and title instead, not a prerelease. Its images were built for
  # the stable channel (LOSOS_CHANNEL above), so it moves the stable
  # channel's tags, and systems installed from it follow the stable releases
  # while those installed from a nightly keep following the nightlies.
  publish:
    needs: [push, release-name]
    if: always() && needs.push.result == 'success' && needs.release-name.result != 'failure'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    # actions: write starts docs.yml at the end, for the site's release index.
    permissions:
      actions: write
      contents: write
      packages: write
    steps:
      - uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4 # v2.0.2
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with: { name: release-refs, path: refs }

      - name: Pull the releases from GHCR
        id: pulled
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          TITLE: ${{ inputs.title }}
        run: |
          # A run publishes both architectures or neither: a release with one
          # missing could never gain it later, since it is not edited.
          if ! [ -f refs/release-ref-x86_64.txt ] || ! [ -f refs/release-ref-aarch64.txt ]; then
            echo "any=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Only some architectures reached GHCR, so no nightly is published."
            exit 0
          fi
          printf '%s' "$GHCR_TOKEN" \
            | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          for arch in x86_64 aarch64; do
            oras pull "$(cat "refs/release-ref-$arch.txt")" --output "pulled/$arch"
          done
          # The UKI's name is <id>_<version>_<arch>.efi on both architectures,
          # and both were built from this commit, so they agree.
          versions=$(sed -En 's/^[0-9a-f]+  .*_([0-9]{8}\.[0-9]{6})_(x86_64|aarch64)\.efi$/\1/p' \
            pulled/*/SHA256SUMS | sort -u)
          if [ "$(printf '%s\n' "$versions" | grep -c .)" != 1 ]; then
            echo "::error::Expected one version across the architectures, found: ${versions:-none}"
            exit 1
          fi
          # 20261010.175322 is tagged nightly-20261010T1753, unless the run
          # was started by hand with a tag (release-name checked it).
          if [ -n "$TAG" ]; then
            tag=$TAG title=${TITLE:-$TAG} nightly=false
          else
            tag=nightly-${versions:0:8}T${versions:9:4} title="LosOS nightly $versions" nightly=true
          fi
          # A title is one line, so it cannot add outputs of its own.
          title=${title//[$'\r\n']/ }
          {
            echo "version=$versions"
            echo "tag=$tag"
            echo "title=$title"
            echo "nightly=$nightly"
            echo "any=true"
          } >> "$GITHUB_OUTPUT"

      # proxy/ serves `images:<channel>-<arch>` at /updates/<channel>/<arch>/,
      # so the tag moves only here, to the artifact the release below is made
      # of: `nightly-<arch>` for a nightly, `stable-<arch>` for a tagged
      # release.
      - name: Move the channel tags in GHCR
        if: steps.pulled.outputs.any == 'true'
        run: |
          for arch in x86_64 aarch64; do
            oras tag "$(cat "refs/release-ref-$arch.txt")" "$LOSOS_CHANNEL-$arch"
          done

      # The release carries every file of both architectures. Each
      # architecture's SHA256SUMS goes with its signature, renamed because
      # both are called SHA256SUMS; the signature covers the bytes, not the
      # name. GitHub rejects an asset of 2 GiB or more, and /usr and the disk
      # image are already past it, so such a file goes up in 2000 MiB parts
      # named <file>.part-00 on, which `cat` joins back into the file its line
      # of SHA256SUMS names.
      - name: Publish the release
        if: steps.pulled.outputs.any == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.pulled.outputs.tag }}
          TITLE: ${{ steps.pulled.outputs.title }}
          NIGHTLY: ${{ steps.pulled.outputs.nightly }}
          VERSION: ${{ steps.pulled.outputs.version }}
          PROXY_URL: ${{ vars.LOSOS_PROXY_URL }}
        run: |
          # A tag is published once. A re-run of this commit finds its
          # release there and stops; only a draft, which an upload that died
          # half-way leaves behind and which is not yet immutable, is
          # replaced.
          if draft=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$draft" != true ] && [ "$NIGHTLY" = true ]; then
              echo "::notice::$TAG is already published, and a release is never edited."
              exit 0
            elif [ "$draft" != true ]; then
              echo "::error::$TAG was released while this run built, and a release is never edited."
              exit 1
            fi
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes
          fi
          shopt -s nullglob
          mkdir assets
          for arch in x86_64 aarch64; do
            dir=pulled/$arch
            mv "$dir/SHA256SUMS" "assets/SHA256SUMS-$arch"
            mv "$dir/SHA256SUMS.gpg" "assets/SHA256SUMS-$arch.gpg"
            rm -f "$dir/.version"
            # The two architectures share no file name but these, since
            # every other name carries its architecture or is x86_64's alone.
            # rmdir fails the step if one ever did and was left behind.
            mv -n -t assets "$dir"/*
            rmdir "$dir"
          done
          limit=$((2 * 1024 * 1024 * 1024))
          for file in assets/*; do
            if [ "$(stat -c %s "$file")" -ge "$limit" ]; then
              split --bytes=2000MiB --numeric-suffixes --suffix-length=2 "$file" "$file.part-"
              rm "$file"
              parts=("$file".part-*)
              echo "Split $(basename "$file") into ${#parts[@]} parts."
            fi
          done
          ls -l assets
          if [ -n "$PROXY_URL" ]; then
            fetched="fetch them from \`${PROXY_URL%/}/updates/$LOSOS_CHANNEL/<arch>/\`, which serves its newest release"
          else
            fetched="fetch them from its newest release, which the documentation site lists"
          fi
          cat > notes.md <<NOTES
          Built from $GITHUB_SHA, version \`$VERSION\`, for x86_64 and aarch64.

          - **Install:** write \`*-installer.iso\` to a USB stick and boot it, or run the Windows installer on a PC that keeps Windows. The ISO installs this version from this release over the network; the Windows installer installs the newest release of the $LOSOS_CHANNEL channel.
          - **Update images:** the UKI (\`.efi\`) and the two halves of \`/usr\` (\`_usr-*.raw.xz\`) are what systemd-sysupdate installs. Systems installed from this release follow the $LOSOS_CHANNEL channel and $fetched; these are the same files, pinned to this version.
          - **Disk image:** \`<arch>.raw.xz\`. Unpack it and write it to a disk, or convert it for a VM with \`qemu-img convert -O qcow2\`.
          - **Files of 2 GiB or more** are split into \`.part-00\`, \`.part-01\` and on, because GitHub rejects larger assets. \`cat <file>.part-* > <file>\` joins one.
          - **Checking:** \`SHA256SUMS-<arch>\` lists that architecture's files and \`SHA256SUMS-<arch>.gpg\` signs it with the [update signing key]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$GITHUB_SHA/nixos/keys/update-signing.asc). \`gpg --verify SHA256SUMS-<arch>.gpg SHA256SUMS-<arch>\`, then \`sha256sum --check --ignore-missing SHA256SUMS-<arch>\`.
          NOTES
          # gh creates the release as a draft, uploads every asset and only
          # then publishes it, so an immutable release is never published
          # with files still missing.
          prerelease=()
          [ "$NIGHTLY" = true ] && prerelease=(--prerelease)
          # The runner's connection to the API can drop for a moment (a
          # nightly was lost to one "dial tcp ... i/o timeout"), and this
          # step comes hours into the run, so a failed attempt is tried
          # again. What it left behind decides how: a draft is deleted and
          # started over, and a published release means only the answer was
          # lost.
          for attempt in 1 2 3; do
            if gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "$TITLE" "${prerelease[@]}" --notes-file notes.md \
              assets/*; then
              exit 0
            fi
            [ "$attempt" = 3 ] && break
            echo "::warning::Publishing $TAG failed (attempt $attempt of 3); trying again in a minute."
            sleep 60
            if draft=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null); then
              if [ "$draft" != true ]; then
                echo "::notice::$TAG was published by the attempt that failed."
                exit 0
              fi
              gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes
            fi
          done
          echo "::error::Publishing $TAG failed three times."
          exit 1

      # The documentation site carries each channel's newest release as the
      # index installed systems update from (website/release-index.js), so
      # it is built again once this one is up. A run started with the job's
      # own token would start no workflow, but workflow_dispatch is the
      # exception GitHub makes.
      - name: Rebuild the site's release index
        if: steps.pulled.outputs.any == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: gh workflow run docs.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"
