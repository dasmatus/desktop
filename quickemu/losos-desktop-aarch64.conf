#!/usr/bin/env -S quickemu --vm
# LosOS Desktop in quickemu, on an aarch64 host. The same machine as
# losos-desktop-x86_64.conf, and docs/quickemu.md covers both. On an x86_64
# host quickemu emulates it under TCG, too slowly for the installer's initrd
# to find its CD in time.
guest_os="linux"
arch="aarch64"

disk_img="losos-desktop-aarch64/disk.qcow2"
iso="losos-desktop-aarch64/installer.iso"

# The aarch64 image has no BIOS half, so UEFI is the only way it starts.
boot="efi"
secureboot="off"
tpm="on"

disk_size="64G"
ram="8G"
cpu_cores="4"

# quickemu gives an aarch64 guest virtio-gpu-gl-pci, there being no VGA.
gl="on"
